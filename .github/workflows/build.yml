name: build-packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to upload packages to (e.g. v1.0.0). Leave empty to only upload artifacts."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve OpenWrt SDK
        id: sdk
        env:
          OWRT_VER: "25.12.5"
          TARGET: "x86"
          SUBTARGET: "64"
        run: |
          base="https://downloads.openwrt.org/releases/${OWRT_VER}/targets/${TARGET}/${SUBTARGET}"
          file=$(curl -fsSL "$base/" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|zst)' | head -n1)
          if [ -z "$file" ]; then
            echo "SDK archive not found in $base" >&2
            exit 1
          fi
          echo "url=$base/$file" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Download and extract SDK
        run: |
          cd "$HOME"
          file="${{ steps.sdk.outputs.file }}"
          url="${{ steps.sdk.outputs.url }}"
          case "$file" in
            *.zst)
              sudo apt-get update -qq
              sudo apt-get install -y -qq zstd >/dev/null
              curl -fsSL -o sdk.tar.zst "$url"
              unzstd sdk.tar.zst
              mv sdk.tar.zst sdk.tar
              tar xf sdk.tar
              ;;
            *)
              curl -fsSL -o sdk.tar.xz "$url"
              tar xJf sdk.tar.xz
              ;;
          esac
          mv openwrt-sdk-*/ sdk

      - name: Prepare SDK feeds (for dependencies)
        run: |
          cd "$HOME/sdk"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add standalone package
        run: |
          cd "$HOME/sdk"
          SRC="$GITHUB_WORKSPACE"
          PKG="package/luci-theme-allure"
          rm -rf "$PKG"
          mkdir -p "$PKG/files/www/luci-static/allure" \
                   "$PKG/files/www/luci-static/resources/view/status" \
                   "$PKG/files/etc/uci-defaults" \
                   "$PKG/files/usr/share/luci/menu.d" \
                   "$PKG/files/usr/share/rpcd/acl.d" \
                   "$PKG/files/usr/share/rpcd/ucode" \
                   "$PKG/files/usr/share/ucode/luci/template/themes/allure"

          cp "$SRC/htdocs/luci-static/allure/allure-dashboard-core.js" "$PKG/files/www/luci-static/allure/"
          cp "$SRC/htdocs/luci-static/allure/allure-ui.js" "$PKG/files/www/luci-static/allure/"
          cp "$SRC/htdocs/luci-static/allure/allure.css" "$PKG/files/www/luci-static/allure/"
          cp "$SRC/htdocs/luci-static/allure/icon.svg" "$PKG/files/www/luci-static/allure/"
          cp "$SRC/htdocs/luci-static/resources/menu-allure.js" "$PKG/files/www/luci-static/resources/"
          cp "$SRC/htdocs/luci-static/resources/view/status/allure.js" "$PKG/files/www/luci-static/resources/view/status/"
          cp "$SRC/root/etc/uci-defaults/99_allure" "$PKG/files/etc/uci-defaults/99_allure"
          chmod 755 "$PKG/files/etc/uci-defaults/99_allure"
          cp "$SRC/root/usr/share/luci/menu.d/luci-theme-allure.json" "$PKG/files/usr/share/luci/menu.d/"
          cp "$SRC/root/usr/share/rpcd/acl.d/luci-theme-allure.json" "$PKG/files/usr/share/rpcd/acl.d/"
          cp "$SRC/root/usr/share/rpcd/ucode/allure.uc" "$PKG/files/usr/share/rpcd/ucode/"
          cp "$SRC/ucode/template/themes/allure/footer.ut" "$PKG/files/usr/share/ucode/luci/template/themes/allure/"
          cp "$SRC/ucode/template/themes/allure/header.ut" "$PKG/files/usr/share/ucode/luci/template/themes/allure/"

          cat > "$PKG/Makefile" <<'MK'
include $(TOPDIR)/rules.mk

PKG_NAME:=luci-theme-allure
PKG_VERSION:=1.0.0
PKG_RELEASE:=1
PKG_LICENSE:=Apache-2.0

include $(INCLUDE_DIR)/package.mk

define Package/luci-theme-allure
  SECTION:=luci
  CATEGORY:=LuCI
  SUBMENU:=Themes
  TITLE:=Allure - macOS-inspired LuCI dashboard & theme
  URL:=https://github.com/xCodeOn/luci-theme-allure
  DEPENDS:=+luci-base +luci-mod-status +luci-theme-bootstrap +rpcd-mod-ucode
  PKGARCH:=all
endef

define Build/Compile
endef

define Package/luci-theme-allure/install
	$(INSTALL_DIR) $(1)/www/luci-static/allure \
		$(1)/www/luci-static/resources/view/status \
		$(1)/etc/uci-defaults \
		$(1)/usr/share/luci/menu.d \
		$(1)/usr/share/rpcd/acl.d \
		$(1)/usr/share/rpcd/ucode \
		$(1)/usr/share/ucode/luci/template/themes/allure
	$(INSTALL_BIN) ./files/etc/uci-defaults/99_allure $(1)/etc/uci-defaults/99_allure
	$(INSTALL_DATA) ./files/www/luci-static/allure/* $(1)/www/luci-static/allure/
	$(INSTALL_DATA) ./files/www/luci-static/resources/* $(1)/www/luci-static/resources/
	$(INSTALL_DATA) ./files/www/luci-static/resources/view/status/* $(1)/www/luci-static/resources/view/status/
	$(INSTALL_DATA) ./files/usr/share/luci/menu.d/* $(1)/usr/share/luci/menu.d/
	$(INSTALL_DATA) ./files/usr/share/rpcd/acl.d/* $(1)/usr/share/rpcd/acl.d/
	$(INSTALL_DATA) ./files/usr/share/rpcd/ucode/* $(1)/usr/share/rpcd/ucode/
	$(INSTALL_DATA) ./files/usr/share/ucode/luci/template/themes/allure/* $(1)/usr/share/ucode/luci/template/themes/allure/
endef

$(eval $(call BuildPackage,luci-theme-allure))
MK

      - name: Configure and build package
        run: |
          cd "$HOME/sdk"
          grep -q 'CONFIG_PACKAGE_luci-theme-allure' .config \
            && sed -i 's/# CONFIG_PACKAGE_luci-theme-allure is not set/CONFIG_PACKAGE_luci-theme-allure=y/' .config \
            || echo 'CONFIG_PACKAGE_luci-theme-allure=y' >> .config
          make defconfig
          make package/luci-theme-allure/compile V=s

      - name: Collect packages
        run: |
          mkdir -p dist
          find "$HOME/sdk/bin" -name 'luci-theme-allure*.ipk' -exec cp {} dist/ \; 2>/dev/null || true
          find "$HOME/sdk/bin" -name 'luci-theme-allure*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true
          if [ -z "$(ls -A dist)" ]; then
            echo "No packages produced!" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-allure-packages
          path: dist/
          if-no-files-found: error

      - name: Attach to release (dispatch with release_tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" dist/* --clobber
